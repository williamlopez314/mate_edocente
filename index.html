<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mate e-Docente | Plataforma Interactiva</title>
    
    <!-- KaTeX para renderizado de fórmulas matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- SheetJS para lectura de archivos Excel (.xls, .xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #18bc9c;
            --bg-color: #ecf0f1;
            --text-color: #333;
            --correct-color: #27ae60;
            --error-color: #c0392b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; }

        /* Menú Lateral (Estilo Clásico) */
        .sidebar {
            width: 260px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-header { padding: 20px; background-color: #1a252f; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .nav-item {
            padding: 15px 20px; cursor: pointer; border-bottom: 1px solid #34495e;
            transition: background 0.3s;
        }
        .nav-item:hover, .nav-item.active { background-color: var(--secondary-color); }
        .nav-item.hidden { display: none; }

        /* Contenido Principal */
        .main-content {
            flex-grow: 1; padding: 40px; overflow-y: auto; position: relative;
        }

        .tab-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Elementos de UI */
        h1, h2 { color: var(--primary-color); margin-bottom: 20px; }
        p { margin-bottom: 15px; font-size: 1.1rem; line-height: 1.6; }
        
        .btn {
            padding: 10px 20px; border: none; border-radius: 5px; font-size: 1rem;
            cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .btn-primary { background-color: var(--secondary-color); color: white; }
        .btn-primary:hover { background-color: #128f76; }
        .btn-admin { background-color: #e67e22; color: white; margin-top: 20px; }
        .btn-evaluar { background-color: var(--primary-color); color: white; width: 100%; margin-top: 20px; }

        /* Estilos de Preguntas */
        .question-card {
            background: white; border-radius: 8px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid var(--secondary-color);
        }
        .options-list { list-style: none; margin-top: 15px; }
        .option-item {
            padding: 12px 15px; margin-bottom: 8px; background: var(--bg-color);
            border: 1px solid #bdc3c7; border-radius: 5px; cursor: pointer;
            display: flex; align-items: center;
        }
        .option-item:hover { background: #d5dbdb; }
        .option-item.selected { background: #d1f2eb; border-color: var(--secondary-color); }
        
        .feedback { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }
        .feedback.correct { display: block; background-color: #d5f5e3; color: var(--correct-color); }
        .feedback.incorrect { display: block; background-color: #fadbd8; color: var(--error-color); }

        /* Panel Admin */
        .admin-box { background: white; padding: 30px; border-radius: 8px; border: 2px dashed #7f8c8d; }
    </style>
</head>
<body>

    <!-- Menú Lateral -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Mate e-Docente</div>
        <!-- Los enlaces se generan por JS -->
    </div>

    <!-- Contenido Principal -->
    <div class="main-content" id="main-content">
        <!-- Las secciones se generan por JS -->
    </div>

    <script>
        // Estructura completa del curso
        const estructura = [
            { id: 'portada', title: 'Inicio / Portada', type: 'info' },
            { id: 'diagnostico', title: 'Diagnóstico Inicial', type: 'quiz' },
            { id: 'sesion1', title: 'Sesión 1: Números y Operatoria', type: 'quiz' },
            { id: 'sesion2', title: 'Sesión 2: Álgebra y Funciones', type: 'quiz' },
            { id: 'sesion3', title: 'Sesión 3: Geometría Métrica', type: 'quiz' },
            { id: 'sesion4', title: 'Sesión 4: Geometría Analítica', type: 'quiz' },
            { id: 'sesion5', title: 'Sesión 5: Probabilidades', type: 'quiz' },
            { id: 'sesion6', title: 'Sesión 6: Estadística', type: 'quiz' },
            { id: 'sesion7', title: 'Sesión 7: Números Complejos', type: 'quiz' },
            { id: 'sesion8', title: 'Sesión 8: Límites y Derivadas', type: 'quiz' },
            { id: 'sesion9', title: 'Sesión 9: Integrales', type: 'quiz' },
            { id: 'sesion10', title: 'Sesión 10: Modelamiento', type: 'quiz' },
            { id: 'intermedia', title: 'Evaluación Intermedia', type: 'quiz' },
            { id: 'didactica', title: 'Ítem de Didáctica', type: 'quiz' },
            { id: 'final', title: 'Evaluación Final', type: 'quiz' },
            { id: 'admin', title: 'Panel de Administración', type: 'admin', hidden: true }
        ];

        // Base de datos de ejemplo (se puede alimentar con el Excel del admin)
        const baseDePreguntas = {
            'diagnostico': [
                { id: 1, text: "Si $$ \\log_{3x}(m) = 2 $$ con $$ x $$ y $$ m $$ reales positivos y $$ x \\neq \\frac{1}{3} $$. ¿Cuál de las siguientes expresiones es equivalente a $$ x $$?", options: { A: "$$ \\log_{8}m $$", B: "$$ \\frac{\\log_{2}m}{3} $$", C: "$$ \\sqrt{\\frac{m}{3}} $$", D: "$$ \\frac{\\sqrt{m}}{3} $$" }, correct: "D" }
            ],
            'sesion1': [
                { id: 2, text: "¿Cuál es el resultado de la multiplicación de los números complejos $$(5+2i)$$ y $$(1-4i)$$?", options: { A: "5 - 8i", B: "11 + 8i", C: "13 - 18i", D: "-3 - 18i" }, correct: "C" }
            ]
        };

        const respuestasUsuario = {};

        function initApp() {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');

            estructura.forEach((sec, index) => {
                // Generar Menú
                const navItem = document.createElement('div');
                navItem.className = `nav-item ${sec.hidden ? 'hidden' : ''}`;
                navItem.id = `nav-${sec.id}`;
                navItem.innerText = sec.title;
                navItem.onclick = () => openTab(sec.id);
                sidebar.appendChild(navItem);

                // Generar Contenedores de Sección
                const sectionDiv = document.createElement('div');
                sectionDiv.className = `tab-section`;
                sectionDiv.id = `sec-${sec.id}`;
                
                if (sec.type === 'info') {
                    sectionDiv.innerHTML = `
                        <h1>Bienvenido a Mate e-Docente</h1>
                        <p>Herramienta interactiva para la preparación y evaluación de conocimientos específicos y pedagógicos en Matemática.</p>
                        <p>Selecciona una evaluación en el menú lateral para comenzar. Cada módulo cuenta con retroalimentación inmediata al finalizar.</p>
                        <hr style="margin: 30px 0; border: 1px solid #ccc;">
                        <h3>Acceso Restringido</h3>
                        <p>Para cargar nuevos instrumentos (PDF/Excel), accede al panel de administración.</p>
                        <button class="btn btn-admin" onclick="loginAdmin()">Acceder como Administrador</button>
                    `;
                } else if (sec.type === 'admin') {
                    sectionDiv.innerHTML = `
                        <h1>Panel de Administración</h1>
                        <div class="admin-box">
                            <h3>Cargar Instrumento de Evaluación (2024, 2023, etc.)</h3>
                            <p>Sube un archivo <b>.xlsx</b> con las columnas: Año, Numero, Enunciado, Opt_A, Opt_B, Opt_C, Opt_D, Correcta, Seccion_Destino.</p>
                            <input type="file" id="file-upload" accept=".xlsx, .xls, .pdf" style="margin: 15px 0; display: block;">
                            <button class="btn btn-primary" onclick="procesarArchivo()">Procesar y Cargar</button>
                            <div id="admin-status" style="margin-top:15px; font-weight:bold;"></div>
                        </div>
                    `;
                } else {
                    // Plantilla para quizzes (Diagnóstico, Sesiones, etc.)
                    sectionDiv.innerHTML = `<h1>${sec.title}</h1><div id="content-${sec.id}"></div>`;
                }
                main.appendChild(sectionDiv);
            });

            // Abrir la primera pestaña y renderizar preguntas
            openTab('portada');
            renderQuizzes();
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`sec-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
        }

        function loginAdmin() {
            // Protección básica frontend para habilitar la pestaña
            const pass = prompt("Ingrese la contraseña de administrador:");
            if (pass === "admin2026" || pass === "william") {
                document.getElementById('nav-admin').classList.remove('hidden');
                openTab('admin');
            } else {
                alert("Contraseña incorrecta.");
            }
        }

        function renderQuizzes() {
            Object.keys(baseDePreguntas).forEach(seccionId => {
                const container = document.getElementById(`content-${seccionId}`);
                if (!container) return;

                let html = '';
                baseDePreguntas[seccionId].forEach((q, qIndex) => {
                    html += `
                        <div class="question-card" id="q-${seccionId}-${q.id}">
                            <p><strong>Pregunta ${qIndex + 1}:</strong><br><br>${q.text}</p>
                            <ul class="options-list">
                                ${Object.entries(q.options).map(([key, val]) => `
                                    <li class="option-item" onclick="seleccionarOpcion('${seccionId}', ${q.id}, '${key}')" id="opt-${seccionId}-${q.id}-${key}">
                                        <strong>${key})</strong>&nbsp;&nbsp;${val}
                                    </li>
                                `).join('')}
                            </ul>
                            <div id="feedback-${seccionId}-${q.id}" class="feedback"></div>
                        </div>
                    `;
                });
                
                if(baseDePreguntas[seccionId].length > 0) {
                    html += `<button class="btn btn-evaluar" onclick="evaluarSeccion('${seccionId}')">Revisar Respuestas de ${seccionId.toUpperCase()}</button>`;
                } else {
                    html += `<p>Aún no hay preguntas cargadas en esta sección.</p>`;
                }
                
                container.innerHTML = html;
            });

            // Renderizar matemáticas con KaTeX en todo el documento
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }

        function seleccionarOpcion(seccionId, questionId, key) {
            // Limpiar selecciones previas de la pregunta
            document.querySelectorAll(`#q-${seccionId}-${questionId} .option-item`).forEach(el => el.classList.remove('selected'));
            // Marcar la actual
            document.getElementById(`opt-${seccionId}-${questionId}-${key}`).classList.add('selected');
            // Guardar en memoria
            respuestasUsuario[`${seccionId}-${questionId}`] = key;
        }

        function evaluarSeccion(seccionId) {
            const preguntas = baseDePreguntas[seccionId];
            let correctas = 0;

            preguntas.forEach(q => {
                const userAns = respuestasUsuario[`${seccionId}-${q.id}`];
                const feedbackDiv = document.getElementById(`feedback-${seccionId}-${q.id}`);

                if (userAns === q.correct) {
                    feedbackDiv.className = 'feedback correct';
                    feedbackDiv.innerHTML = `¡Correcto! La alternativa ${q.correct} es la respuesta indicada.`;
                    correctas++;
                } else if (userAns) {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = `Incorrecto. Seleccionaste ${userAns}, pero la correcta es la <strong>${q.correct}</strong>.`;
                } else {
                    feedbackDiv.className = 'feedback incorrect';
                    feedbackDiv.innerHTML = `Omitida. La respuesta correcta es la <strong>${q.correct}</strong>.`;
                }
            });

            alert(`Evaluación de ${seccionId} finalizada.\nPuntaje: ${correctas} de ${preguntas.length} correctas.`);
        }

        function procesarArchivo() {
            const file = document.getElementById('file-upload').files[0];
            const statusDiv = document.getElementById('admin-status');
            
            if (!file) {
                statusDiv.style.color = "var(--error-color)";
                statusDiv.innerText = "Selecciona un archivo primero.";
                return;
            }
            if(file.name.endsWith('.pdf')) {
                statusDiv.style.color = "var(--primary-color)";
                statusDiv.innerText = "Los PDF requieren conexión a backend para extracción de texto. (En desarrollo)";
                return;
            }
            
            // Procesamiento de Excel local mediante SheetJS
            const reader = new FileReader();
            reader.onload = (e) => {
                const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                const data = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                // Mapear los datos al objeto baseDePreguntas y re-renderizar
                // (Requiere que el Excel tenga columna 'Seccion_Destino' que coincida con los IDs)
                statusDiv.style.color = "var(--correct-color)";
                statusDiv.innerText = `Archivo procesado: ${data.length} filas detectadas. Listo para inyectar a la base local.`;
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = initApp;
    </script>
</body>
</html>
