function impHtml(msg){const o=Object.keys(D).map(d=>`<option value="${d}">${D[d]}</option>`).join("");return note(msg)+`<div class="card"><b>Importar un instrumento</b><div class="m">Adjunta un PDF con texto (no escaneado) o un .txt, o pega el texto. Se detectan los enunciados numerados, las alternativas A–D y la clave de respuestas, y se adaptan al formato de la herramienta para que los revises antes de publicar. Las preguntas abiertas se ignoran.</div>
<label>Nombre del instrumento (fuente)</label><input id="iz" placeholder="Ej.: ECEP Educación Media Matemática"><label>Eje por defecto</label><select id="idf">${o}</select><label>Nivel por defecto</label><select id="ilf"><option value="1">Básico</option><option value="2" selected>Medio</option><option value="3">Alto</option></select>
<label>Archivo</label><input type="file" id="if" accept=".pdf,.txt" onchange="impFile(this)"><label>…o pega el texto</label><textarea id="it" rows="6"></textarea><button class="p" onclick="impRun(document.getElementById('it').value)">Analizar texto</button></div><div id="ip"></div>`}
async function pdfText(f){if(!window.pdfjsLib){await new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";e.onload=ok;e.onerror=no;document.head.appendChild(e)});pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out="";for(let p=1;p<=d.numPages;p++){const c=await(await d.getPage(p)).getTextContent();let y=null;for(const it of c.items){const yy=it.transform[5];if(y!==null)out+=Math.abs(yy-y)>3?"\n":" ";out+=it.str;y=yy}out+="\n"}return out}
async function impFile(el){const f=el.files[0];if(!f)return;document.getElementById("ip").innerHTML="Leyendo archivo…";try{impRun(/\.pdf$/i.test(f.name)?await pdfText(f):await f.text(),f.name)}catch(e){document.getElementById("ip").innerHTML="No se pudo leer el archivo: "+esc(e.message||e)}}
function parseQ(t){t=t.replace(/\r/g,"");let key={},body=t;const hm=[...t.matchAll(/(^|\n)[ \t]*(?:claves?(?: de respuestas?)?|respuestas? correctas?|solucionario|pauta(?: de correcci[oó]n)?|respuestas)[ \t:.-]*(?=\n)/gi)];
for(const h of hm.reverse()){const tail=t.slice(h.index),pairs=[...tail.matchAll(/(?:^|[\s,;])(\d{1,3})\s*[-–:.)]?\s*([A-Da-d])(?=[\s,;.]|$)/g)];if(pairs.length>=5){pairs.forEach(m=>{key[+m[1]]="abcd".indexOf(m[2].toLowerCase())});body=t.slice(0,h.index);break}}
const ms=[...body.matchAll(/(^|\n)[ \t]*(\d{1,3})[ \t]*[.)][ \t]+/g)],out=[];
ms.forEach((m,k)=>{const a=m.index+m[0].length,e=k+1<ms.length?ms[k+1].index:body.length;let b=body.slice(a,e).replace(/\s+/g," ").trim();
const f=(L,from)=>{const m2=new RegExp("(^|\\s)"+L+"\\s*[).]\\s","i").exec(b.slice(from));return m2?{i:from+m2.index+m2[1].length,e:from+m2.index+m2[0].length}:null};
const A=f("A",0),B=A&&f("B",A.e),C=B&&f("C",B.e),Dd=C&&f("D",C.e);if(!Dd)return;
let o=[b.slice(A.e,B.i),b.slice(B.e,C.i),b.slice(C.e,Dd.i),b.slice(Dd.e)].map(x=>x.trim()),c=key[+m[2]]!=null?key[+m[2]]:-1;
const am=/(?:respuesta correcta|respuesta|clave|correcta)\s*[:\-]\s*([A-Da-d])\b.*$/i.exec(o[3]);if(am){c="abcd".indexOf(am[1].toLowerCase());o[3]=o[3].slice(0,am.index).trim()}
o[3]=o[3].replace(/\s*(p[áa]gina|p[áa]g\.?)\s*\d+.*$/i,"").trim();
const e2=b.slice(0,A.i).trim();if(!e2||o.some(x=>!x||x.length>400))return;out.push({n:+m[2],e:e2,o,c})});return out}
function impRun(t,name){const d=document.getElementById("idf").value,l=+document.getElementById("ilf").value,z=document.getElementById("iz");if(name&&!z.value)z.value=name.replace(/\.[^.]+$/,"");
IMP=parseQ(t).map(x=>({...x,d,l}));const el=document.getElementById("ip");
if(!IMP.length)return el.innerHTML=`<div class="card">No se detectaron preguntas con alternativas A–D. Revisa que los enunciados estén numerados («1.», «2.») y las alternativas lleven «A)», «B)», «C)», «D)». Los PDF escaneados (imágenes) no tienen texto: usa una versión con texto o pega el contenido.</div>`;
const ok=IMP.filter(x=>x.c>=0).length,oD=Object.keys(D).map(k=>`<option value="${k}">${D[k]}</option>`);
el.innerHTML=`<div class="card exp">${IMP.length} preguntas detectadas · ${ok} con clave de respuesta. Revisa, corrige y elige la correcta donde falte.</div>`+IMP.map((x,k)=>`<div class="card"><label><input type="checkbox" id="ik${k}" checked style="width:auto;margin:0 6px 0 0">Incluir pregunta ${x.n}</label><select id="id${k}">${oD.map(o=>o.replace(`value="${x.d}"`,`value="${x.d}" selected`)).join("")}</select><select id="il${k}">${[1,2,3].map(v=>`<option value="${v}" ${v==x.l?"selected":""}>${["Básico","Medio","Alto"][v-1]}</option>`).join("")}</select><textarea id="ie${k}" rows="3">${esc(x.e)}</textarea>${x.o.map((o,j)=>`<input id="io${k}_${j}" value="${esc(o)}">`).join("")}<select id="ic${k}"><option value="">Correcta: elegir</option>${"ABCD".split("").map((L,j)=>`<option value="${L}" ${x.c==j?"selected":""}>${L}</option>`).join("")}</select></div>`).join("")+`<button class="p big" onclick="impPub()">Publicar seleccionadas</button>`;renderMath()}
function impPub(){const g=i=>document.getElementById(i),z=g("iz").value.trim()||"Importado",list=[];let bad=0;
IMP.forEach((x,k)=>{if(!g("ik"+k).checked)return;const op=[0,1,2,3].map(j=>g(`io${k}_${j}`).value),c=g("ic"+k).value,o=val({dominio:g("id"+k).value,nivel:g("il"+k).value,enunciado:g("ie"+k).value,opciones:op,correcta:c,explicacion:c?`La alternativa correcta es ${c}) ${op["ABCD".indexOf(c)]}.`:"",fuente:z});o?list.push(o):bad++});
if(bad)alert(bad+" pregunta(s) no se publicarán: falta elegir la correcta o hay alternativas vacías o repetidas.");if(!list.length)return;PEND=list;pub()}
function readF(el){const f=el.files[0];if(!f)return;f.text().then(t=>{let rows;try{if(/\.csv$/i.test(f.name)){const r=csv(t),h=r[0].map(x=>x.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""));rows=r.slice(1).map(w=>Object.fromEntries(h.map((k,i)=>[k,w[i]])))}else{rows=JSON.parse(t);if(!Array.isArray(rows))rows=rows.preguntas}}catch(e){return document.getElementById("pv").innerHTML="No se pudo leer el archivo."}
const fz=document.getElementById("fz").value.trim();PEND=rows.map(val).filter(Boolean).map(o=>({...o,fuente:o.fuente||fz||f.name}));
document.getElementById("pv").innerHTML=`<p>${PEND.length} válidas · ${rows.length-PEND.length} rechazadas</p>${PEND.length?`<button class="p" onclick="pub()">Publicar ${PEND.length} preguntas</button>`:""}`})}
async function pub(){const list=PEND;PEND=[];try{if(window.FB){await FB.add(list);BANK=(await FB.bank()).map(norm)}else{const a=(ls("ecepBank")||[]).concat(list);localStorage.setItem("ecepBank",JSON.stringify(a));BANK=a.map((o,i)=>norm({...o,id:i}))}admin("Se publicaron "+list.length+" preguntas.")}catch(e){admin("Error al publicar: "+(e.code||e.message))}}
function addOne(){const g=i=>document.getElementById(i).value,o=val({dominio:g("fd"),nivel:g("fl"),enunciado:g("fq"),opciones:["A","B","C","D"].map(x=>g("f"+x)),correcta:g("fc"),explicacion:g("fe"),ambito:g("fa"),fuente:g("fs")});if(!o)return admin("Revisa el formulario: faltan datos o hay alternativas repetidas.");PEND=[o];pub()}

const x=t=="json"?[JSON.stringify([ej],null,1),"plantilla-instrumento.json"]:["dominio,nivel,enunciado,A,B,C,D,correcta,explicacion,fuente,ambito\nP,2,\"Enunciado\",Alt A,Alt B,Alt C,Alt D,B,\"Explicación\",\"Nombre del instrumento\",Didáctica\n","plantilla-instrumento.csv"];
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x[0]]));a.download=x[1];a.click()}
