<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preparación ECEP · Matemática Media</title>
<style>
:root{--bg:#f4f6ff;--c:#fff;--t:#1c2236;--m:#667089;--p:#4f6df5;--p2:#8b5cf6;--ok:#16a34a;--no:#dc2626;--b:#e2e6f3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1220;--c:#171d31;--t:#e9ecf8;--m:#9aa4c0;--p:#7b93ff;--p2:#a78bfa;--ok:#4ade80;--no:#fb7185;--b:#2a3350}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);background:radial-gradient(900px 420px at 50% -120px,color-mix(in srgb,var(--p) 28%,transparent),transparent),var(--bg);min-height:100vh}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}h1{font-size:1.45rem;margin:.2em 0}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(20,30,70,.06)}
.btn,.p,a.b{display:inline-block;padding:9px 14px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.p{background:var(--p);color:#fff;border:none}.p:hover{opacity:.93}.big{padding:12px 22px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--b);color:var(--t)}
.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.no{background:color-mix(in srgb,var(--no) 20%,transparent);color:var(--no)}
.m{color:var(--m);font-size:.9rem}
ol,ul{padding-left:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 13px;white-space:normal;line-height:1.35;word-break:break-word}
.opt.sel{border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,var(--c))}
.opt.c-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--c))}
.opt.c-no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--c))}
.bar{height:7px;background:var(--b);border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--p);transition:width .2s}
.s{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--b)}.s:last-child{border:0}
input,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t);font:inherit;margin:4px 0 10px}
textarea{min-height:90px;resize:vertical}label{font-size:.85rem;font-weight:600;color:var(--m)}
#er{color:var(--no);font-weight:600;margin:8px 0;white-space:pre-wrap}
.exp{border-left:4px solid var(--p);padding-left:10px;margin-top:10px;font-size:.92rem}
.sub{font-size:.8rem;color:var(--m);margin-top:2px}
table.tab{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}table.tab th,table.tab td{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left}
table.tab th{color:var(--m);font-size:.78rem;text-transform:uppercase}
</style></head><body><main id="app"></main>
<script>
// Base de preguntas disciplinares y didácticas (ECEP / PAES M2)
const D={N:"Números",A:"Álgebra",F:"Funciones",G:"Geometría",D:"Datos y probabilidades",P:"Didáctica y ámbitos pedagógicos"};
const Q=[
["N",1,"¿Cuál de los siguientes números es irracional?",["0,25","√16","√2","22/7"],2,"√2 no se puede escribir como fracción; √16=4, 0,25=1/4 y 22/7 son racionales."],
["N",1,"¿A qué es equivalente 2⁻³?",["−8","−6","1/8","1/6"],2,"a⁻ⁿ = 1/aⁿ, luego 2⁻³ = 1/2³ = 1/8."],

["N",2,"¿Cuál es el valor de log(1000) + log₀,₁(0,01)?",["5","1","3","4"],0,"log₁₀(1000) = 3; (0,1)² = 0,01 luego log₀,₁(0,01) = 2. 3 + 2 = 5."],
["N",2,"Al simplificar √50 + √18 − √8 se obtiene:",["√60","6√2","8√2","4√2"],1,"5√2 + 3√2 − 2√2 = 6√2."],
["N",3,"¿Cuál es el valor de i²⁰²⁵?",["1","−1","i","−i"],2,"Las potencias de i se repiten cada 4; 2025 = 4·506 + 1, luego i²⁰²⁵ = i."],
["N",3,"Si z = 3 + 4i, ¿cuál es el módulo |z|?",["7","25","5","1"],2,"|z| = √(3² + 4²) = √(9+16) = 5."],
["N",3,"Al racionalizar 2 / (√3 − 1) se obtiene:",["√3 + 1","√3 − 1","2√3 + 2","(√3 + 1)/2"],0,"Multiplicando por (√3 + 1): 2(√3+1)/(3−1) = √3 + 1."],
["A",1,"Si 3x − 5 = 10, entonces x =",["3","5","6","15"],1,"3x = 15, x = 5."],
["A",1,"Al factorizar x² − 9 se obtiene:",["(x−3)²","(x+3)(x−3)","x(x−9)","(x+9)(x−1)"],1,"Diferencia de cuadrados: a² − b² = (a+b)(a−b)."],
["A",1,"El sistema {x + y = 7, x − y = 1} tiene como solución:",["(4,3)","(3,4)","(5,2)","(6,1)"],0,"Sumando ambas ecuaciones: 2x = 8 ⇒ x = 4; y = 3."],
["A",2,"Las soluciones de x² − 5x + 6 = 0 son:",["x=1, x=6","x=−2, x=−3","x=2, x=3","x=−1, x=5"],2,"(x − 2)(x − 3) = 0 ⇒ x = 2 o x = 3."],
["A",2,"Si 2^(x+1) = 16, entonces x =",["3","4","7","2"],0,"2^(x+1) = 2⁴ ⇒ x + 1 = 4 ⇒ x = 3."],
["A",2,"¿Cuál es el conjunto solución de |x − 3| < 2?",["x < 5","1 < x < 5","x < 1 o x > 5","−2 < x < 2"],1,"−2 < x − 3 < 2 ⇒ 1 < x < 5."],
["A",3,"¿Para qué valores de k la ecuación x² + kx + 9 = 0 tiene una única solución real?",["k = 6","k = 6 o k = −6","k = 3","k > 6"],1,"Discriminante Δ = k² − 36 = 0 ⇒ k = ±6."],
["A",3,"Si a + b = 5 y ab = 6, ¿cuánto vale a² + b²?",["13","19","25","1"],0,"(a+b)² = a² + 2ab + b² ⇒ 25 = a² + 12 + b² ⇒ 13."],
["A",3,"Al resolver log₂(x) + log₂(x − 2) = 3 en ℝ, la solución es:",["x = 4 y x = −2","x = 4","x = 8","x = 2"],1,"log₂(x(x−2)) = 3 ⇒ x² − 2x = 8 ⇒ (x−4)(x+2)=0. Se descarta x=−2 por dominio."],
["F",1,"Dada f(x) = 2x − 3, ¿cuál es el valor de f(4)?",["5","8","1","11"],0,"f(4) = 2(4) − 3 = 5."],
["F",1,"El gráfico de f(x) = −3x + 2 es una recta con pendiente:",["3","−3","2","−2"],1,"En f(x) = mx + c, m es la pendiente: −3."],
["F",1,"¿Cuál es el vértice de la parábola f(x) = x² − 4x + 5?",["(2, 1)","(−2, 17)","(4, 5)","(0, 5)"],0,"x_v = −b/(2a) = 4/2 = 2; f(2) = 4 − 8 + 5 = 1."],
["F",2,"Si f(x) = 3^x, ¿cuál es f⁻¹(x)?",["f⁻¹(x) = x/3","f⁻¹(x) = log₃(x)","f⁻¹(x) = 3^(−x)","f⁻¹(x) = ∛x"],1,"La función inversa de la exponencial en base 3 es el logaritmo en base 3."],
["F",2,"¿Cuál es el dominio de f(x) = √(x − 4)?",["ℝ","x > 0","[4, +∞[","]4, +∞["],2,"La cantidad subradical debe ser no negativa: x − 4 ≥ 0 ⇒ x ≥ 4."],
["F",2,"La función f(x) = −2(x − 1)² + 3 alcanza su valor máximo en:",["y = 1","y = 3","y = −2","y = 0"],1,"Como a = −2 < 0, la parábola abre hacia abajo y el máximo es el y del vértice: 3."],
["F",3,"Dadas f(x) = 2x + 1 y g(x) = x², ¿cuánto vale (g ∘ f)(3)?",["13","49","19","37"],1,"f(3) = 7; g(f(3)) = g(7) = 7² = 49."],
["F",3,"¿Cuál es el recorrido de f(x) = 2 / (x − 1)?",["ℝ","ℝ \ {1}","ℝ \ {0}","[0, +∞["],2,"No puede tomar el valor 0 pues el numerador no se anula."],
["F",3,"Si f(x) = log₂(x + 3), ¿cuál es su asíntota vertical?",["x = 0","x = 3","x = −3","y = −3"],2,"El argumento se anula en x = −3, que es la asíntota vertical."],
["G",1,"En un triángulo rectángulo los catetos miden 6 cm y 8 cm. La hipotenusa mide:",["10 cm","14 cm","48 cm","12 cm"],0,"c = √(6² + 8²) = √(36+64) = 10."],
["G",1,"¿Cuál es el área de un círculo de radio 5 cm? (en cm²)",["10π","25π","50π","5π"],1,"Área = π · r² = 25π."],
["G",1,"Un ángulo inscrito subtiende un arco de 80°. ¿Cuánto mide el ángulo?",["40°","80°","160°","20°"],0,"El ángulo inscrito mide la mitad del arco que subtiende: 40°."],
["G",2,"Una figura de área 5 se amplía con una homotecia de razón 3. ¿Cuál es el área de la nueva figura?",["15","45","135","8"],1,"Las áreas escalan con k² = 9; 5·9 = 45."],
["G",2,"El volumen de un cilindro de radio 3 cm y altura 5 cm es:",["15π cm³","45π cm³","30π cm³","75π cm³"],1,"V = π r² h = π · 9 · 5 = 45π."],
["G",2,"En un triángulo ABC, DE es paralela a BC con D en AB y E en AC. Si AD=3, DB=6 y AE=2, ¿cuánto mide EC?",["4","6","5","3"],0,"Por Tales: AD/DB = AE/EC ⇒ 3/6 = 2/EC ⇒ EC = 4."],
["G",3,"Un cono y un cilindro tienen igual base y altura. Si el volumen del cilindro es 90 cm³, el del cono es:",["30 cm³","45 cm³","60 cm³","90 cm³"],0,"V_cono = (1/3) V_cilindro = 30 cm³."],
["G",3,"¿Cuál es la distancia entre los puntos (1, 2) y (4, 6) en el plano cartesiano?",["5","7","√13","25"],0,"d = √((4−1)² + (6−2)²) = √(9 + 16) = 5."],
["G",3,"Si la razón de homotecia es k = −2, la figura resultante es:",["Invertida y del doble de tamaño","Directa y de la mitad de tamaño","Invertida y de la mitad de tamaño","Igual a la original"],0,"k negativo invierte la figura; |k|=2 duplica sus dimensiones lineales."],
["D",1,"¿Cuál es la media de 2, 4, 6 y 8?",["4","5","6","20"],1,"20/4 = 5."],
["D",1,"Al lanzar un dado común de 6 caras, ¿cuál es la probabilidad de obtener un número primo?",["1/6","1/2","2/3","1/3"],1,"Casos favorables {2, 3, 5} (3 de 6): 3/6 = 1/2."],
["D",1,"¿Cuál es la mediana del conjunto {3, 1, 7, 2, 9}?",["7","3","2","4,4"],1,"Ordenado: {1, 2, 3, 7, 9}; el valor central es 3."],
["D",2,"En una caja hay 4 bolas rojas y 6 azules. Si se extraen dos bolas sin reposición, ¿cuál es P(ambas rojas)?",["16/100","2/15","4/15","12/90"],1,"P = (4/10) · (3/9) = 12/90 = 2/15."],
["D",2,"¿Cuál es el rango de los datos {12, 5, 22, 18, 9}?",["17","22","5","13"],0,"Rango = Máx − Mín = 22 − 5 = 17."],
["D",2,"Si X ~ N(0, 1), ¿cuál es P(X ≤ 0)?",["0","0,5","1","0,25"],1,"La distribución normal estándar es simétrica respecto a 0."],
["D",3,"Si P(A∩B)=0,2 y P(B)=0,5, ¿cuánto vale P(A|B)?",["0,1","0,4","0,7","0,25"],1,"P(A|B)=P(A∩B)/P(B)=0,4."],
["D",3,"¿De cuántas formas se puede elegir un comité de 3 personas entre 6?",["18","20","120","216"],1,"C(6,3)=20 (el orden no importa)."],
["D",3,"Si una variable X toma valores 0 y 2 con P(X=0)=0,3 y P(X=2)=0,7, su valor esperado E(X) es:",["1,0","1,4","0,6","2,0"],1,"E(X) = 0·0,3 + 2·0,7 = 1,4."],
["P",1,"Una docente busca introducir las operaciones con números racionales de forma concreta y pictórica. ¿Cuál estrategia es más pertinente?",["Dictar las reglas de suma de fracciones con distinto denominador","Utilizar tiras de fracciones y diagramas de barras para representar equivalencias","Resolver 20 ejercicios simbólicos en la pizarra","Explicar el algoritmo del mínimo común múltiplo directamente"],1,"El uso de representaciones pictóricas (diagramas de barras/tiras) permite conectar el significado conceptual antes de la formalización algorítmica.",["ECEP 2023 · Ítem 1","Inst. Evaluación Docente"]],
["P",1,"Un estudiante simplifica (x+3)/3 como x+1. ¿Qué conocimiento previo es más probable que falte?",["Resolver ecuaciones lineales","Propiedad distributiva y concepto de simplificación como división del numerador completo","Mínimo común múltiplo","Factorización de diferencia de cuadrados"],1,"El error proviene de simplificar un término del numerador en lugar de dividir cada sumando por el denominador (distributividad).",["ECEP 2024 · Ítem 5","Inst. Evaluación Docente"]],
["P",2,"¿Qué actividad promueve mejor la modelación matemática en 3° Medio?",["Calcular 20 derivadas consecutivas","Plantear una función que describa el vaciado de un estanque y predecir tiempos","Memorizar las fórmulas de área de superficies","Resolver un sistema de ecuaciones abstracto por sustitución"],1,"Modelar implica representar un fenómeno del entorno mediante funciones y usar el modelo para hacer predicciones en contexto.",["ECEP 2023 · Ítem 10","Inst. Evaluación Docente"]],
["P",2,"Para que los estudiantes comprendan el concepto de función inversa, ¿qué secuencia es más pertinente?",["Definición formal sagital → propiedades inyectivas → cálculo algorítmico","Partir de la función lineal afín en contexto (ej.: costo/conversión) e intercambiar variables de entrada y salida pictórica y gráficamente","Entregar directamente la regla y sustituir x por y","Graficar funciones cuadráticas no restringidas"],1,"El aprendizaje con sentido parte de contextos reversibles donde la entrada y salida intercambian roles antes de la técnica algebraica.",["ECEP 2023 · Ítem 9","Inst. Evaluación Docente"]],
["P",3,"¿Qué ítem evalúa mejor el razonamiento y la argumentación en Geometría?",["Calcular el área de un triángulo de base 4 y altura 3","Decidir si una afirmación sobre semejanza es siempre, a veces o nunca verdadera, justificando con un contraejemplo","Medir con regla la hipotenusa de un triángulo dibujado","Aplicar el teorema de Pitágoras con datos numéricos directos"],1,"Justificar la validez de una conjetura o construir un contraejemplo requiere razonamiento matemático de nivel superior.",["ECEP 2024 · Ítem 8","Inst. Evaluación Docente"]],
["P",1,"¿Qué recurso favorece más la visualización del teorema de Pitágoras?",["Una demostración con áreas de cuadrados sobre los lados de un triángulo rectángulo","Una guía con 30 ejercicios numéricos","Una disertación histórica sobre Pitágoras","Escribir a² + b² = c² en la pizarra repetidamente"],0,"La representación geométrica con áreas cuadradas permite comprobar físicamente la conservación del área a² + b² = c².",["ECEP 2024 · Ítem 3","Inst. Evaluación Docente"]],
["P",2,"En una evaluación formativa se observa que el 60% comete el error log(a+b) = log(a)+log(b). ¿Cuál es la retroalimentación más efectiva?",["Descontar puntaje e indicar 'repasar propiedades'","Presentar contraejemplos numéricos (ej.: log(10+90) vs log 10 + log 90) para que comprueben la falsedad de la igualdad","Dictar la lista de propiedades 5 veces","Explicar que la suma se convierte en resta"],1,"Los contraejemplos generan disonancia cognitiva y ayudan a que los estudiantes identifiquen y corrijan el error por sí mismos.",["ECEP 2023 · Ítem 10","Inst. Evaluación Docente"]],
["P",3,"Un profesor desea evaluar la habilidad de 'Resolver problemas' según el currículum. ¿Cuál situación es idónea?",["Un ejercicio de cálculo directo de porcentaje","Un problema no rutinario en contexto sin estrategia previa explícita donde deban seleccionar o crear un modelo","Una pregunta de opción múltiple de memorización de definiciones","Completar una tabla de valores dada la fórmula de la función"],1,"Resolver problemas implica enfrentar situaciones no rutinarias donde el estudiante debe decidir la estrategia adecuada.",["ECEP 2024 · Ítem 10","Inst. Evaluación Docente"]]
];

// Generadores dinámicos de ítems disciplinares con variaciones numéricas
const pk=a=>a[Math.floor(Math.random()*a.length)];
const ri=(m,M)=>Math.floor(Math.random()*(M-m+1))+m;
const sp=n=>n.toString().replace(/0/g,"⁰").replace(/1/g,"¹").replace(/2/g,"²").replace(/3/g,"³").replace(/4/g,"⁴").replace(/5/g,"⁵").replace(/6/g,"⁶").replace(/7/g,"⁷").replace(/8/g,"⁸").replace(/9/g,"⁹");
function sh(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function mk(d,l,e,c,o,ex){
  const opts=[c,...o.slice(0,3)];
  const s=sh(opts.map((x,i)=>({x,i})));
  return [d,l,e,s.map(z=>String(z.x)),s.findIndex(z=>z.i===0),ex||""];
}
const G={
  N:[
    [1,()=>{const p=pk([10,20,25,30,40]),r=ri(2,12)*20;return mk("N",1,`¿Cuánto es el ${p}% de ${r}?`,r*p/100,[r*p/10,r+p,r*p/50],`Cálculo: (${p}/100) · ${r} = ${r*p/100}.`)}],
    [2,()=>{const a=ri(2,5),b=ri(2,4);return mk("N",2,`Si log_(${a}) x = ${b}, ¿cuál es el valor de x?`,Math.pow(a,b),[a*b,Math.pow(b,a),a+b],`Por definición: ${a}^${b} = ${Math.pow(a,b)}.`)}],
    [3,()=>{const n=ri(20,200),v=["1","i","−1","−i"];return mk("N",3,`¿Cuál es el valor de i${sp(n)}?`,v[n%4],v.filter((x,j)=>j!==n%4),`Potencias de i: n mod 4 = ${n%4} ⇒ iⁿ = ${v[n%4]}.`)}],
    [3,()=>{const k=pk([4,6,8,10]),n=pk([3,5,7]);return mk("N",3,`Al racionalizar ${k}/√${n} se obtiene:`,`${k}√${n}/${n}`,[`${k}√${n}`,`${n}√${k}/${k}`,`${k}/${n}`],`Multiplicando por √${n}/√${n}.`)}]
  ],
  A:[
    [1,()=>{const p=ri(3,9),q=ri(4,9),r=ri(1,2);return mk("A",1,`Al reducir ${p}a + ${q}a − ${r}a se obtiene:`,`${p+q-r}a`,[`${p+q+r}a`,`${p*q-r}a`,`${p+q}a`],`Suma y resta de términos semejantes: ${p}+${q}−${r} = ${p+q-r}.`)}],
    [2,()=>{const b=ri(2,8),c=ri(1,9),d=b*b-4*c;return mk("A",2,`¿Cuál es el discriminante de x² + ${b}x + ${c} = 0?`,d,[b*b+4*c,b-4*c,2*b-c],`Δ = b² − 4ac = ${b}² − 4(1)(${c}) = ${d}.`)}],
    [3,()=>{const a=ri(2,5),k=ri(1,4);return mk("A",3,`Si 2^(${a}x − ${k}) = 2^(${k}x + ${a+2}), entonces x =`,(a+2+k)/(a-k)|0===(a+2+k)/(a-k)?(a+2+k)/(a-k):`${a+2+k}/${a-k}`,["2","3","1"],`Igualando exponentes: ${a}x − ${k} = ${k}x + ${a+2}.`)}]
  ],
  F:[
    [1,()=>{const m=ri(2,6),c=ri(1,9),x=ri(2,5);return mk("F",1,`Dada f(x) = ${m}x + ${c}, ¿cuál es f(${x})?`,m*x+c,[m+x+c,m*x,c*x],`f(${x}) = ${m}(${x}) + ${c} = ${m*x+c}.`)}],
    [2,()=>{const h=ri(1,5),k=ri(1,5);return mk("F",2,`El vértice de la parábola f(x) = (x − ${h})² + ${k} es:`,`(${h}, ${k})`,[`(${-h}, ${k})`,`(${h}, ${-k})`,`(${k}, ${h})`],`Forma canónica f(x) = (x−h)² + k ⇒ V(${h}, ${k}).`)}]
  ],
  G:[
    [1,()=>{const [a,b,c]=pk([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]),k=ri(1,3);return mk("G",1,`Un triángulo rectángulo tiene catetos de ${a*k} cm y ${b*k} cm. Su hipotenusa mide:`,`${c*k} cm`,[`${(a+b)*k} cm`,`${c*k+2} cm`,`${a*b*k} cm`],`Trío pitagórico escalar (${a},${b},${c}) · ${k} = ${c*k}.`)}],
    [2,()=>{const r=ri(2,6);return mk("G",2,`El área de un círculo de radio ${r} cm es:`,`${r*r}π cm²`,[`${2*r}π cm²`,`${r*r*r}π cm²`,`${4*r}π cm²`],`Área = π · r² = ${r*r}π.`)}]
  ],
  D:[
    [1,()=>{let a,m;do{m=ri(10,20);a=[ri(5,25),ri(5,25),ri(5,25),ri(5,25)];a.push(5*m-a.reduce((x,y)=>x+y))}while(a[4]<1||a[4]>30);return mk("D",1,`La media de {${a.join(", ")}} es:`,m,[m-1,m+2,m+1],`Suma = ${5*m}; 5*m/5 = ${m}.`)}],
    [1,()=>{const r=ri(2,9),b=ri(2,9)+(ri(0,1)?0:0);return mk("D",1,`Una urna tiene ${r} bolas rojas y ${b} azules. ¿Cuál es la probabilidad de extraer una bola roja?`,`${r}/${r+b}`,[`${b}/${r+b}`,`${r}/${b}`,`1/${r+b}`],`Casos favorables (${r}) / casos totales (${r+b}).`)}],
    [3,()=>{const n=ri(4,6),f=[1,1,2,6,24,120,720];return mk("D",3,`¿De cuántas formas se pueden ordenar ${n} libros distintos en un estante?`,f[n],[n*n,n*(n-1),f[n-1]],"n!.")}]
  ]
};

function dom0(d,l,u){
  let c=Q.filter(q=>q[0]==d&&(d=="P"||q[1]==l)&&!u.has(q[2])),q;
  if(d=="P"){if(!c.length)c=Q.filter(q=>q[0]=="P");q=sh(pk(c))}
  else if(c.length&&Math.random()<.4)q=sh(pk(c));
  else{const g=G[d].filter(x=>x[0]==l);for(let t=0;t<30;t++){q=pk(g)[1]();if(!u.has(q[2]))break}}
  u.add(q[2]);return q
}
function dom(d,l,u){
  const b=BANK.filter(x=>x[0]==d&&!u.has(x[2])&&(d=="P"||x[1]==l));
  if(b.length&&(d=="P"||Math.random()<.7)){const q=sh(pk(b));u.add(q[2]);return q}
  return dom0(d,l,u)
}

const T0=d=>{const u=new Set();return[1,2,3].flatMap(l=>Array.from({length:5},()=>dom(d,l,u)))};
const T=d=>{const u=new Set();return[...[1,2,3].flatMap(l=>Array.from({length:6},()=>dom(d,l,u))),...Array.from({length:12},()=>dom("P",1,u))]};
const M2=(nd,np,ls)=>{const u=new Set(),r=[],ds=["N","A","F","G","D"];for(let k=0;k<nd;k++)r.push(dom(ds[k%5],pk(ls),u));for(let k=0;k<np;k++)r.push(dom("P",ri(1,3),u));return r.sort(()=>Math.random()-.5)};

function val(o){
  let op=(o.opciones||[o.a,o.b,o.c,o.d]).map(x=>String(x==null?"":x).trim()),c=o.correcta;
  if(typeof c=="string"){
    const i=["A","B","C","D"].indexOf(c.trim().toUpperCase());
    if(i>=0)c=i;else c=parseInt(c,10);
  }
  c=Number(c);
  const d=String(o.dominio||"").trim().toUpperCase(),e=String(o.enunciado||"").trim(),l=Number(o.nivel||1);
  if(!d||!e||op.length!=4||op.some(x=>!x)||new Set(op).size!=4||!(c>=0&&c<4)||l<1||l>3)return null;
  return [d,l,e,op,c,String(o.explicacion||"").trim(),String(o.fuente||"").trim(),String(o.ambito||"").trim(),String(o.id||"")];
}

async function pdfText(f){
  if(!window.pdfjsLib){
    await new Promise((ok,no)=>{
      const e=document.createElement("script");
      e.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
      e.onload=ok;
      e.onerror=no;
      document.head.appendChild(e);
    });
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const buf=await f.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i),txt=await page.getTextContent();
    out+=txt.items.map(x=>x.str).join(" ")+"\n";
  }
  return out;
}

function parsePdf(txt){
  const raw=txt.replace(/\r/g,"\n").split(/\n+/).map(x=>x.trim()).filter(Boolean).join(" ");
  const m=raw.split(/(?=\b\d{1,2}[\.\-\)]\s+[A-ZÁÉÍÓÚ¿i])/g);
  const res=[];
  for(const block of m){
    const qm=block.match(/^\b(\d{1,2})[\.\-\)]\s+(.*?)(?=\s+[ABCD][\.\-\)]\s+|$)/i);
    if(!qm)continue;
    const num=qm[1],qtxt=qm[2].trim();
    const ops=[];
    const opRegex=/\b([ABCD])[\.\-\)]\s+(.*?)(?=\s+[ABCD][\.\-\)]\s+|$)/gi;
    let om;
    while((om=opRegex.exec(block))!==null){
      ops.push({letra:om[1].toUpperCase(),txt:om[2].trim()});
    }
    if(ops.length>=4){
      const o4=ops.slice(0,4);
      res.push({num,enunciado:qtxt,opciones:o4.map(x=>x.txt)});
    }
  }
  return res;
}

function readF(el){
  const f=el.files[0];
  if(!f)return;
  const srcName=document.getElementById("fz").value.trim()||f.name.replace(/\.[^.]+$/,"");
  if(/\.pdf$/i.test(f.name)){
    document.getElementById("pv").innerHTML="<p class='m'>Procesando PDF...</p>";
    pdfText(f).then(txt=>{
      IMP=parsePdf(txt);
      renderImp(document.getElementById("pv"),srcName);
    }).catch(e=>{
      document.getElementById("pv").innerHTML="<div class='card exp'>Error al leer PDF: "+esc(e.message)+"</div>";
    });
    return;
  }
  f.text().then(t=>{
    let rows;
    try{
      if(/\.csv$/i.test(f.name)){
        const r=csvP(t);
        rows=r.slice(1).map(x=>({dominio:x[0],nivel:x[1],enunciado:x[2],A:x[3],B:x[4],C:x[5],D:x[6],correcta:x[7],explicacion:x[8],fuente:srcName}));
      }else rows=JSON.parse(t);
    }catch(e){return alert("Archivo inválido: "+e.message)}
    PEND=[];
    rows.forEach(r=>{
      const o=val(Object.assign({fuente:srcName},r));
      if(o)PEND.push(o);
    });
    document.getElementById("pv").innerHTML=`<p>${PEND.length} válidas · ${rows.length-PEND.length} rechazadas</p>${PEND.length?`<button class="p" onclick="pub()">Publicar ${PEND.length} preguntas</button>`:""}`;
  });
}

function csvP(t){
  const r=[],L=t.split(/\r?\n/);
  for(let line of L){
    if(!line.trim())continue;
    const c=[];let q=false,cur="";
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch=='"'){if(q&&line[i+1]=='"')cur+='"',i++;else q=!q}
      else if(ch==','&&!q){c.push(cur.trim());cur=""}
      else cur+=ch;
    }
    c.push(cur.trim());
    r.push(c);
  }
  return r;
}
